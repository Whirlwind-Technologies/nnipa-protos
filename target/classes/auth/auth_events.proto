syntax = "proto3";

package com.nnipa.proto.auth;

option java_package = "com.nnipa.proto.auth";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "common/common.proto";

// ============================================
// Generic Authentication Event
// ============================================

// Generic event wrapper that matches your Java code structure
message AuthenticationEvent {
  string event_id = 1;
  string event_type = 2;
  string user_id = 3;
  string tenant_id = 4;
  string correlation_id = 5;
  int64 timestamp = 6;

  // Optional fields for additional context
  string ip_address = 7;
  string user_agent = 8;
  string session_id = 9;
  map<string, string> additional_data = 10;
}

// ============================================
// Security Event Message
// ============================================

message SecurityEvent {
  string event_id = 1;
  string event_type = 2;
  string user_id = 3;
  string username = 4;
  string tenant_id = 5;
  string correlation_id = 6;
  int64 timestamp = 7;
  string ip_address = 8;
  string user_agent = 9;
  string severity = 10;
  string description = 11;
  int32 risk_score = 12;
  map<string, string> metadata = 13;

  // Additional security-specific fields
  string source_system = 14;
  string detection_method = 15;
  repeated string threat_indicators = 16;
  string geographical_location = 17;
  bool requires_investigation = 18;
}

// ============================================
// SAGA EVENTS
// ============================================

// Event: User Registration Saga
// This single event initiates the entire registration flow
message UserRegistrationSagaEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;

  // User information
  string user_id = 2;
  string email = 3;
  string username = 4;
  string first_name = 5;
  string last_name = 6;
  string phone_number = 7;

  // Organization information (for self-signup)
  string organization_name = 8;
  string organization_type = 9;
  string organization_email = 10;
  string organization_phone = 11;

  // Registration context
  string activation_token = 12;
  bool mfa_enabled = 13;
  string subscription_plan = 14;  // TRIAL, BASIC, PRO, etc.
  google.protobuf.Timestamp initiated_at = 15;
  string ip_address = 16;
  string user_agent = 17;

  // Saga control
  string saga_id = 18;  // Unique identifier for this saga instance
  int32 saga_version = 19;  // For handling schema evolution
}

// Event: Registration Saga Completed
// Published when all steps are successfully completed
message RegistrationSagaCompletedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string saga_id = 2;
  string user_id = 3;
  string tenant_id = 4;
  google.protobuf.Timestamp completed_at = 5;
  int64 duration_ms = 6;  // Total time taken

  // Final state
  string user_status = 7;
  string tenant_status = 8;
  bool email_sent = 9;
}

// Event: Registration Saga Failed
// Published when any step fails and compensation is needed
message RegistrationSagaFailedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string saga_id = 2;
  string user_id = 3;
  string tenant_id = 4;  // May be empty if tenant creation failed

  // Failure details
  string failed_stage = 5;  // TENANT_CREATION, USER_PROFILE_CREATION, EMAIL_SENDING
  string error_code = 6;
  string error_message = 7;
  google.protobuf.Timestamp failed_at = 8;

  // Compensation needed
  bool user_created = 9;
  bool tenant_created = 10;
  bool profile_created = 11;

  // Retry information
  int32 retry_count = 12;
  bool retriable = 13;
}

// ============================================
// EXISTING REGISTRATION EVENTS (KEPT FOR COMPATIBILITY)
// ============================================

// Event: Self-Signup (DEPRECATED - use UserRegistrationSagaEvent)
// Kept for backward compatibility during migration
message SelfSignupEvent {
  option deprecated = true;

  com.nnipa.proto.common.EventMetadata metadata = 1;
  string user_id = 2;
  string email = 3;
  string username = 4;
  string first_name = 5;
  string last_name = 6;
  string phone_number = 7;
  string activation_token = 8;
  string organization_name = 9;
  string organization_type = 10;
  string organization_email = 11;
  bool mfa_enabled = 12;
  google.protobuf.Timestamp timestamp = 13;
  string ip_address = 14;
  string user_agent = 15;
}

// Event: Admin-Created User (KEEP - still used for existing tenant flow)
message AdminCreatedUserEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string user_id = 2;
  string tenant_id = 3;
  string email = 4;
  string username = 5;
  string first_name = 6;
  string last_name = 7;
  string phone_number = 8;
  string activation_token = 9;
  string created_by = 10;
  string initial_role = 11;
  bool mfa_enabled = 12;
  bool must_change_password = 13;
  google.protobuf.Timestamp timestamp = 14;
}

// Event: User Registered (Generic - KEEP for notifications/audit)
message UserRegisteredEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;

  message RegistrationData {
    string user_id = 1;
    string tenant_id = 2;
    string username = 3;
    string email = 4;
    string registration_method = 5;  // SELF_SIGNUP, ADMIN_CREATED, SAGA
    google.protobuf.Timestamp registered_at = 6;
    string ip_address = 7;
    string user_agent = 8;
    bool email_verified = 9;
    string registration_source = 10;
    map<string, string> additional_info = 11;

    // New fields for saga support
    string saga_id = 12;
    bool via_saga = 13;
  }

  RegistrationData registration = 2;
}

// Event: User Activated (UNCHANGED)
message UserActivatedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string user_id = 2;
  string tenant_id = 3;
  string activation_token = 4;
  google.protobuf.Timestamp activated_at = 5;
  string ip_address = 6;
}

// ============================================
// LOGIN/LOGOUT EVENTS
// ============================================

// Event: User Login
message UserLoginEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;

  message LoginData {
    string user_id = 1;
    string tenant_id = 2;
    string username = 3;
    string email = 4;
    string authentication_method = 5;
    string ip_address = 6;
    string user_agent = 7;
    string session_id = 8;
    google.protobuf.Timestamp login_time = 9;
    bool mfa_used = 10;
    string device_id = 11;
    map<string, string> additional_info = 12;
  }

  LoginData login = 2;
}

// Event: User Logout
message UserLogoutEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;

  message LogoutData {
    string user_id = 1;
    string tenant_id = 2;
    string session_id = 3;
    google.protobuf.Timestamp logout_time = 4;
    string logout_reason = 5;
    int64 session_duration_ms = 6;
  }

  LogoutData logout = 2;
}

// Event: Login Failed
message LoginFailedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;

  message FailureData {
    string username = 1;
    string tenant_id = 2;
    string failure_reason = 3;
    string ip_address = 4;
    string user_agent = 5;
    google.protobuf.Timestamp attempt_time = 6;
    int32 failure_count = 7;
    bool account_locked = 8;
  }

  FailureData failure = 2;
}

// ============================================
// PASSWORD EVENTS
// ============================================

// Event: Password Changed
message PasswordChangedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string user_id = 2;
  string tenant_id = 3;
  string changed_by = 4;
  google.protobuf.Timestamp changed_at = 5;
  bool forced_change = 6;
  string change_reason = 7;
}

// Event: Password Reset Requested
message PasswordResetRequestedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string user_id = 2;
  string email = 3;
  string tenant_id = 4;
  string reset_token = 5;
  google.protobuf.Timestamp requested_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  string ip_address = 8;
}

// ============================================
// MFA EVENTS
// ============================================

// Event: MFA Enabled
message MFAEnabledEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string user_id = 2;
  string tenant_id = 3;
  string mfa_type = 4;
  google.protobuf.Timestamp enabled_at = 5;
  string device_name = 6;
}

// ============================================
// SAGA STATE EVENTS (for monitoring/debugging)
// ============================================

// Event: Saga Stage Completed
// Published after each major step for observability
message SagaStageCompletedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string saga_id = 2;
  string stage_name = 3;  // USER_CREATED, TENANT_CREATED, PROFILE_CREATED
  google.protobuf.Timestamp completed_at = 4;
  int64 stage_duration_ms = 5;
  map<string, string> stage_output = 6;  // IDs and other outputs
}

// Event: Saga Compensation Started
// Published when rollback begins
message SagaCompensationStartedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string saga_id = 2;
  string user_id = 3;
  string trigger_reason = 4;
  repeated string compensation_steps = 5;  // Steps to be compensated
  google.protobuf.Timestamp started_at = 6;
}

// Event: Saga Compensation Completed
// Published when rollback completes
message SagaCompensationCompletedEvent {
  com.nnipa.proto.common.EventMetadata metadata = 1;
  string saga_id = 2;
  bool success = 3;
  repeated string compensated_steps = 4;
  repeated string failed_compensations = 5;
  google.protobuf.Timestamp completed_at = 6;
}